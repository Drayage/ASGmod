name: KataCat M3.4.1

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful KataCat M3.3 run ID; blank selects the latest successful run"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

env:
  KATACAT_M341_SIMULATIONS: "32"
  KATACAT_M341_CURRENT_MS: "50"
  KATACAT_M341_MAX_MOVES: "90"
  KATACAT_M341_CAPTURE_DEPTH: "7"
  KATACAT_M341_CAPTURE_ATTACK_MS: "25"
  KATACAT_M341_CAPTURE_DEFENSE_MS: "50"
  KATACAT_M341_CAPTURE_DEFENSE_LIMIT: "12"
  KATACAT_M341_FINAL_VERIFY_MS: "75"
  KATACAT_M341_FINAL_VERIFY_LIMIT: "5"
  KATACAT_M341_RESCUE_CURRENT_MS: "50"
  KATACAT_M341_RESCUE_VERIFY_MS: "50"
  KATACAT_M341_RESCUE_VERIFY_LIMIT: "8"
  KATACAT_M341_RESCUE_TOTAL_MS: "450"
  KATACAT_M341_EXHAUSTIVE_VERIFY_MS: "25"

jobs:
  prepare_smoke:
    name: Mine 64 games, select parent-safe checkpoint, and run 32-game smoke
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      smoke_pass: ${{ steps.smoke_gate.outputs.passed }}

    steps:
      - name: Checkout M3.4.1 branch
        uses: actions/checkout@v4
        with:
          ref: feat/katacat-m341

      - name: Record commit SHA
        shell: bash
        run: echo "KATACAT_M341_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements-katacat.txt

      - name: Install Python dependencies
        run: pip install -r ml/requirements-katacat.txt

      - name: Build and verify static invariants
        run: |
          npm run build
          npm run katacat:m2-core
          npm run katacat:m32-final-guard
          npm run katacat:m33-relative
          npm run katacat:m341-fallback
          python -m py_compile ml/train_katacat_m341.py
          node --check scripts/gate-katacat-m341.mjs

      - name: Download frozen M3.3 source artifact
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          SOURCE_RUN_ID="$REQUESTED_RUN_ID"
          if [ -z "$SOURCE_RUN_ID" ]; then
            SOURCE_RUN_ID=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/katacat-m33.yml/runs?status=success&per_page=20" \
              --jq '.workflow_runs[0].id')
          fi
          if [ -z "$SOURCE_RUN_ID" ] || [ "$SOURCE_RUN_ID" = "null" ]; then
            echo "No successful KataCat M3.3 workflow run was found" >&2
            exit 1
          fi
          mkdir -p source-artifact
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "katacat-m33-${SOURCE_RUN_ID}" \
            --dir source-artifact
          test -f source-artifact/katacat-m33-model/katacat-m33.pt
          test -f source-artifact/katacat-m0-output/katacat-samples.jsonl
          test -f source-artifact/katacat-m3-output/katacat-selfplay-samples.jsonl
          test -f source-artifact/katacat-m33-mixed/katacat-m33-mixed-samples.jsonl
          test -f source-artifact/katacat-m33-curriculum/katacat-m33-curriculum-samples.jsonl
          echo "KATACAT_M341_SOURCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"

      - name: Mine independent 64-game hard-negative source
        env:
          RUN_KATACAT_M341_HARD_NEGATIVE: "1"
          KATACAT_M341_SOURCE_CHECKPOINT: source-artifact/katacat-m33-model/katacat-m33.pt
          KATACAT_M341_GAMES: "64"
          KATACAT_M341_SIMULATIONS: "32"
          KATACAT_M341_CURRENT_MS: "75"
          KATACAT_M341_MAX_MOVES: "90"
          KATACAT_M341_CAPTURE_DEPTH: "7"
          KATACAT_M341_CAPTURE_ATTACK_MS: "25"
          KATACAT_M341_CAPTURE_DEFENSE_MS: "50"
          KATACAT_M341_CAPTURE_DEFENSE_LIMIT: "12"
          KATACAT_M341_NEGATIVE_SCAN_LIMIT: "12"
          KATACAT_M341_NEGATIVE_SCAN_MS: "50"
          KATACAT_M341_TEACHER_VERIFY_MS: "100"
          KATACAT_M341_FINAL_VERIFY_MS: "75"
          KATACAT_M341_FINAL_VERIFY_LIMIT: "5"
          KATACAT_M341_RESCUE_VERIFY_MS: "50"
          KATACAT_M341_RESCUE_VERIFY_LIMIT: "8"
          KATACAT_M341_RESCUE_TOTAL_MS: "450"
          KATACAT_M341_EXHAUSTIVE_VERIFY_MS: "25"
          KATACAT_M341_MAX_SAMPLES_PER_GAME: "12"
          KATACAT_M341_OUTPUT_DIR: katacat-m341-hard-negative
        run: npm run katacat:m341-hard-negative

      - name: Run generated actual-loss fallback regressions
        env:
          KATACAT_M341_REGRESSION_FIXTURE: katacat-m341-hard-negative/katacat-m341-regression-fixtures.json
          KATACAT_M341_REGRESSION_OUTPUT: katacat-m341-regression/summary.json
        run: |
          mkdir -p katacat-m341-regression
          npm run katacat:m341-fallback

      - name: Fine-tune with parent checkpoint as epoch zero
        run: >-
          python ml/train_katacat_m341.py
          --bootstrap-data=source-artifact/katacat-m0-output/katacat-samples.jsonl
          --selfplay-data=source-artifact/katacat-m3-output/katacat-selfplay-samples.jsonl
          --mixed-data=source-artifact/katacat-m33-mixed/katacat-m33-mixed-samples.jsonl
          --curriculum-data=source-artifact/katacat-m33-curriculum/katacat-m33-curriculum-samples.jsonl
          --hard-negative-data=katacat-m341-hard-negative/katacat-m341-hard-negative-samples.jsonl
          --init-checkpoint=source-artifact/katacat-m33-model/katacat-m33.pt
          --out=katacat-m341-model
          --epochs=6
          --learning-rate=0.000075
          --pairwise-weight=0.75
          --pairwise-margin=0.5
          --commit-sha=${KATACAT_M341_COMMIT_SHA}
          --device=cpu
          --augment=on

      - name: Validate checkpoint selection contract
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          summary = json.loads(Path('katacat-m341-model/summary.json').read_text())
          required = ('parent_validation_loss', 'best_validation_loss', 'selected_epoch', 'improved_over_parent')
          assert all(key in summary for key in required)
          assert summary['best_validation_loss'] <= summary['parent_validation_loss'] + 1e-9
          parent = Path('source-artifact/katacat-m33-model/katacat-m33.pt')
          candidate = Path('katacat-m341-model/katacat-m341.pt')
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          assert digest(parent) == summary['parent_checkpoint_sha256']
          assert digest(candidate) == summary['selected_checkpoint_sha256']
          if summary['selected_epoch'] == 0:
              assert summary['improved_over_parent'] is False
              assert digest(parent) == digest(candidate)
          PY

      - name: Record manifest and checkpoint SHA-256
        shell: bash
        run: |
          PARENT_SHA=$(sha256sum source-artifact/katacat-m33-model/katacat-m33.pt | awk '{print $1}')
          CANDIDATE_SHA=$(sha256sum katacat-m341-model/katacat-m341.pt | awk '{print $1}')
          echo "KATACAT_M341_PARENT_SHA256=$PARENT_SHA" >> "$GITHUB_ENV"
          echo "KATACAT_M341_CANDIDATE_SHA256=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          python - <<PY
          import json
          from pathlib import Path
          Path('katacat-m341-manifest.json').write_text(json.dumps({
              'schemaVersion': 1,
              'stage': 'M3.4.1_MANIFEST',
              'sourceM33RunId': '${KATACAT_M341_SOURCE_RUN_ID}',
              'commitSha': '${KATACAT_M341_COMMIT_SHA}',
              'parentCheckpointSha256': '$PARENT_SHA',
              'candidateCheckpointSha256': '$CANDIDATE_SHA',
          }, indent=2) + '\n')
          PY

      - name: Run 32-game smoke per comparison
        env:
          RUN_KATACAT_M341_ARENA: "1"
          KATACAT_M341_CANDIDATE_CHECKPOINT: katacat-m341-model/katacat-m341.pt
          KATACAT_M341_PARENT_CHECKPOINT: source-artifact/katacat-m33-model/katacat-m33.pt
          KATACAT_M341_PHASE: smoke
          KATACAT_M341_GAMES_PER_COMPARISON: "32"
          KATACAT_M341_ARENA_OUTPUT_DIR: katacat-m341-smoke
        run: npm run katacat:m341-arena

      - name: Evaluate smoke gate
        id: smoke_gate
        run: >-
          npm run katacat:m341-gate --
          --phase=smoke
          --training=katacat-m341-model/summary.json
          --regression=katacat-m341-regression/summary.json
          --arena=katacat-m341-smoke/arena-summary.json
          --output=katacat-m341-gates/smoke.json

      - name: Add prepare and smoke reports
        if: always()
        shell: bash
        run: |
          echo "## KataCat M3.4.1 Prepare + Smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: ${KATACAT_M341_COMMIT_SHA:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- source M3.3 run: ${KATACAT_M341_SOURCE_RUN_ID:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- smoke pass: ${{ steps.smoke_gate.outputs.passed }}" >> "$GITHUB_STEP_SUMMARY"
          for report in \
            katacat-m341-hard-negative/summary.json \
            katacat-m341-regression/summary.json \
            katacat-m341-model/summary.json \
            katacat-m341-manifest.json \
            katacat-m341-smoke/arena-summary.json \
            katacat-m341-gates/smoke.json; do
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "### $report" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            test -f "$report" && cat "$report" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload prepared M3.4.1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katacat-m341-prepared-${{ github.run_id }}
          path: |
            source-artifact/katacat-m33-model/katacat-m33.pt
            katacat-m341-hard-negative/
            katacat-m341-regression/
            katacat-m341-model/
            katacat-m341-manifest.json
            katacat-m341-smoke/
            katacat-m341-gates/smoke.json
          if-no-files-found: warn

  development:
    name: Run 128-game development evaluation
    needs: prepare_smoke
    if: needs.prepare_smoke.outputs.smoke_pass == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      development_pass: ${{ steps.development_gate.outputs.passed }}

    steps:
      - name: Checkout M3.4.1 branch
        uses: actions/checkout@v4
        with:
          ref: feat/katacat-m341

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements-katacat.txt

      - name: Install Python dependencies
        run: pip install -r ml/requirements-katacat.txt

      - name: Download prepared artifact
        uses: actions/download-artifact@v4
        with:
          name: katacat-m341-prepared-${{ github.run_id }}
          path: .

      - name: Restore manifest environment
        shell: bash
        run: |
          echo "KATACAT_M341_COMMIT_SHA=$(jq -r .commitSha katacat-m341-manifest.json)" >> "$GITHUB_ENV"
          echo "KATACAT_M341_PARENT_SHA256=$(jq -r .parentCheckpointSha256 katacat-m341-manifest.json)" >> "$GITHUB_ENV"
          echo "KATACAT_M341_CANDIDATE_SHA256=$(jq -r .candidateCheckpointSha256 katacat-m341-manifest.json)" >> "$GITHUB_ENV"

      - name: Run 128-game development phase per comparison
        env:
          RUN_KATACAT_M341_ARENA: "1"
          KATACAT_M341_CANDIDATE_CHECKPOINT: katacat-m341-model/katacat-m341.pt
          KATACAT_M341_PARENT_CHECKPOINT: source-artifact/katacat-m33-model/katacat-m33.pt
          KATACAT_M341_PHASE: development
          KATACAT_M341_GAMES_PER_COMPARISON: "128"
          KATACAT_M341_ARENA_OUTPUT_DIR: katacat-m341-development
        run: npm run katacat:m341-arena

      - name: Evaluate development gate
        id: development_gate
        run: >-
          npm run katacat:m341-gate --
          --phase=development
          --training=katacat-m341-model/summary.json
          --regression=katacat-m341-regression/summary.json
          --arena=katacat-m341-development/arena-summary.json
          --output=katacat-m341-gates/development.json

      - name: Add development report
        if: always()
        shell: bash
        run: |
          echo "## KataCat M3.4.1 Development" >> "$GITHUB_STEP_SUMMARY"
          echo "- development pass: ${{ steps.development_gate.outputs.passed }}" >> "$GITHUB_STEP_SUMMARY"
          for report in katacat-m341-development/arena-summary.json katacat-m341-gates/development.json; do
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "### $report" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            test -f "$report" && cat "$report" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload development artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katacat-m341-development-${{ github.run_id }}
          path: |
            katacat-m341-development/
            katacat-m341-gates/development.json
          if-no-files-found: warn

  promotion:
    name: Run conditional 400-game promotion evaluation
    needs: [prepare_smoke, development]
    if: needs.development.outputs.development_pass == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout M3.4.1 branch
        uses: actions/checkout@v4
        with:
          ref: feat/katacat-m341

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements-katacat.txt

      - name: Install Python dependencies
        run: pip install -r ml/requirements-katacat.txt

      - name: Download prepared artifact
        uses: actions/download-artifact@v4
        with:
          name: katacat-m341-prepared-${{ github.run_id }}
          path: .

      - name: Download development artifact
        uses: actions/download-artifact@v4
        with:
          name: katacat-m341-development-${{ github.run_id }}
          path: .

      - name: Restore manifest environment
        shell: bash
        run: |
          echo "KATACAT_M341_COMMIT_SHA=$(jq -r .commitSha katacat-m341-manifest.json)" >> "$GITHUB_ENV"
          echo "KATACAT_M341_PARENT_SHA256=$(jq -r .parentCheckpointSha256 katacat-m341-manifest.json)" >> "$GITHUB_ENV"
          echo "KATACAT_M341_CANDIDATE_SHA256=$(jq -r .candidateCheckpointSha256 katacat-m341-manifest.json)" >> "$GITHUB_ENV"

      - name: Run 400-game promotion phase per opponent
        env:
          RUN_KATACAT_M341_ARENA: "1"
          KATACAT_M341_CANDIDATE_CHECKPOINT: katacat-m341-model/katacat-m341.pt
          KATACAT_M341_PARENT_CHECKPOINT: source-artifact/katacat-m33-model/katacat-m33.pt
          KATACAT_M341_PHASE: promotion
          KATACAT_M341_GAMES_PER_COMPARISON: "400"
          KATACAT_M341_ARENA_OUTPUT_DIR: katacat-m341-promotion
        run: npm run katacat:m341-arena

      - name: Evaluate formal promotion gate
        id: promotion_gate
        run: >-
          npm run katacat:m341-gate --
          --phase=promotion
          --training=katacat-m341-model/summary.json
          --regression=katacat-m341-regression/summary.json
          --arena=katacat-m341-promotion/arena-summary.json
          --development=katacat-m341-development/arena-summary.json
          --output=katacat-m341-gates/promotion.json

      - name: Add promotion report
        if: always()
        shell: bash
        run: |
          echo "## KataCat M3.4.1 Promotion" >> "$GITHUB_STEP_SUMMARY"
          echo "- promotion pass: ${{ steps.promotion_gate.outputs.passed }}" >> "$GITHUB_STEP_SUMMARY"
          for report in katacat-m341-promotion/arena-summary.json katacat-m341-gates/promotion.json; do
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "### $report" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            test -f "$report" && cat "$report" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload promotion artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katacat-m341-promotion-${{ github.run_id }}
          path: |
            katacat-m341-promotion/
            katacat-m341-gates/promotion.json
          if-no-files-found: warn
