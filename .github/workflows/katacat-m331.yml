name: KataCat M3.3.1

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful KataCat M3.3 run ID to reuse; blank selects the latest successful run"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  katacat-m331:
    name: Reuse frozen M3.3 checkpoints and run 64-game extended arena
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout M3.3.1 branch
        uses: actions/checkout@v4
        with:
          ref: feat/katacat-m331

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements-katacat.txt

      - name: Install Python inference dependencies
        run: pip install -r ml/requirements-katacat.txt

      - name: Type-check and build
        run: npm run build

      - name: Verify PUCT tactical floor
        run: npm run katacat:m2-core

      - name: Verify adaptive final guard
        run: npm run katacat:m32-final-guard

      - name: Verify player-relative encoding
        run: npm run katacat:m33-relative

      - name: Download frozen M3.3 artifact
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          SOURCE_RUN_ID="$REQUESTED_RUN_ID"
          if [ -z "$SOURCE_RUN_ID" ]; then
            SOURCE_RUN_ID=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/katacat-m33.yml/runs?status=success&per_page=20" \
              --jq '.workflow_runs[0].id')
          fi
          if [ -z "$SOURCE_RUN_ID" ] || [ "$SOURCE_RUN_ID" = "null" ]; then
            echo "No successful KataCat M3.3 workflow run was found" >&2
            exit 1
          fi
          mkdir -p source-artifact
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "katacat-m33-${SOURCE_RUN_ID}" \
            --dir source-artifact
          test -f source-artifact/katacat-m33-model/katacat-m33.pt
          test -f source-artifact/katacat-m31-model/katacat-m3.pt
          echo "run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "KATACAT_M331_SOURCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"

      - name: Run frozen M3.3.1 extended arena
        env:
          RUN_KATACAT_M33_ARENA: "1"
          KATACAT_M33_CANDIDATE_CHECKPOINT: source-artifact/katacat-m33-model/katacat-m33.pt
          KATACAT_M33_CHAMPION_CHECKPOINT: source-artifact/katacat-m31-model/katacat-m3.pt
          KATACAT_M33_GAMES_PER_OPPONENT: "64"
          KATACAT_M33_SIMULATIONS: "32"
          KATACAT_M33_CURRENT_MS: "50"
          KATACAT_M33_MAX_MOVES: "90"
          KATACAT_M33_CAPTURE_DEPTH: "7"
          KATACAT_M33_CAPTURE_ATTACK_MS: "25"
          KATACAT_M33_CAPTURE_DEFENSE_MS: "50"
          KATACAT_M33_CAPTURE_DEFENSE_LIMIT: "12"
          KATACAT_M33_FINAL_VERIFY_MS: "75"
          KATACAT_M33_FINAL_VERIFY_LIMIT: "5"
          KATACAT_M33_RESCUE_CURRENT_MS: "50"
          KATACAT_M33_RESCUE_VERIFY_MS: "50"
          KATACAT_M33_RESCUE_VERIFY_LIMIT: "8"
          KATACAT_M33_RESCUE_TOTAL_MS: "450"
          KATACAT_M33_OUTPUT_DIR: katacat-m331-raw
        run: npm run katacat:m33-arena

      - name: Summarize extended evidence
        run: >-
          npm run katacat:m331-summarize --
          --input=katacat-m331-raw/arena-summary.json
          --output=katacat-m331-output/summary.json
          --source-run-id=${KATACAT_M331_SOURCE_RUN_ID}

      - name: Add M3.3.1 report to summary
        if: always()
        shell: bash
        run: |
          echo "## KataCat M3.3.1 Frozen Extended Arena" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "- Source M3.3 run: ${KATACAT_M331_SOURCE_RUN_ID:-not resolved}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Checkpoints: reused from the source artifact; no training" >> "$GITHUB_STEP_SUMMARY"
          echo "- Games: 64 per opponent, 32 mirrored pairs per opponent" >> "$GITHUB_STEP_SUMMARY"
          echo "- PUCT and tactical rescue settings: unchanged from M3.3" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          test -f katacat-m331-output/summary.json && cat katacat-m331-output/summary.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload M3.3.1 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katacat-m331-${{ github.run_id }}
          path: |
            katacat-m331-raw/
            katacat-m331-output/
          if-no-files-found: warn