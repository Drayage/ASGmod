name: KataCat M3.6

on:
  workflow_dispatch:
    inputs:
      source_m341_run_id:
        description: "Successful KataCat M3.4.1 run ID; blank selects latest"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

env:
  KATACAT_M36_SIMULATIONS: "32"
  KATACAT_M36_CURRENT_MS: "50"
  KATACAT_M36_MAX_MOVES: "90"
  KATACAT_M36_CAPTURE_DEPTH: "7"
  KATACAT_M36_FINAL_VERIFY_MS: "75"
  KATACAT_M36_FINAL_VERIFY_LIMIT: "5"
  KATACAT_M36_RESCUE_VERIFY_MS: "50"
  KATACAT_M36_RESCUE_VERIFY_LIMIT: "8"
  KATACAT_M36_RESCUE_TOTAL_MS: "450"
  KATACAT_M36_EXHAUSTIVE_VERIFY_MS: "25"

jobs:
  prepare_smoke:
    name: Mine 256 games, train residual adapter, and run smoke
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      smoke_pass: ${{ steps.smoke_gate.outputs.passed }}

    steps:
      - name: Checkout M3.6 branch
        uses: actions/checkout@v4
        with:
          ref: feat/katacat-m36

      - name: Record commit SHA
        run: echo "KATACAT_M36_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements-katacat.txt
      - run: pip install -r ml/requirements-katacat.txt

      - name: Build and verify static contracts
        run: |
          npm run build
          npm run katacat:m2-core
          npm run katacat:m32-final-guard
          npm run katacat:m33-relative
          npm run katacat:m341-fallback
          python -m py_compile ml/katacat_m36_adapter.py ml/train_katacat_m36.py ml/katacat_m36_infer.py
          node --check scripts/gate-katacat-m36.mjs

      - name: Download M3.4.1 artifacts and frozen M3.3 data
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.source_m341_run_id }}
        run: |
          set -euo pipefail
          SOURCE_RUN_ID="$REQUESTED_RUN_ID"
          if [ -z "$SOURCE_RUN_ID" ]; then
            SOURCE_RUN_ID=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/katacat-m341.yml/runs?status=success&per_page=20" \
              --jq '.workflow_runs[0].id')
          fi
          if [ -z "$SOURCE_RUN_ID" ] || [ "$SOURCE_RUN_ID" = "null" ]; then
            echo "No successful KataCat M3.4.1 run found" >&2
            exit 1
          fi
          mkdir -p prepared-artifact development-artifact m33-source-artifact
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "katacat-m341-prepared-${SOURCE_RUN_ID}" --dir prepared-artifact
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "katacat-m341-development-${SOURCE_RUN_ID}" --dir development-artifact
          test -f prepared-artifact/katacat-m341-manifest.json
          M33_RUN_ID=$(jq -r '.sourceM33RunId // empty' prepared-artifact/katacat-m341-manifest.json)
          test -n "$M33_RUN_ID"
          gh run download "$M33_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "katacat-m33-${M33_RUN_ID}" --dir m33-source-artifact
          test -f prepared-artifact/katacat-m341-model/katacat-m341.pt
          test -f development-artifact/katacat-m341-development/arena-summary.json
          test -f m33-source-artifact/katacat-m0-output/katacat-samples.jsonl
          test -f m33-source-artifact/katacat-m3-output/katacat-selfplay-samples.jsonl
          test -f m33-source-artifact/katacat-m33-mixed/katacat-m33-mixed-samples.jsonl
          test -f m33-source-artifact/katacat-m33-curriculum/katacat-m33-curriculum-samples.jsonl
          cp development-artifact/katacat-m341-development/arena-summary.json katacat-m36-source-development.json
          echo "KATACAT_M36_SOURCE_M341_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"
          echo "KATACAT_M36_SOURCE_M33_RUN_ID=$M33_RUN_ID" >> "$GITHUB_ENV"

      - name: Mine larger independent hard-negative source
        env:
          RUN_KATACAT_M341_HARD_NEGATIVE: "1"
          KATACAT_M341_SOURCE_CHECKPOINT: prepared-artifact/katacat-m341-model/katacat-m341.pt
          KATACAT_M341_GAMES: "256"
          KATACAT_M341_SIMULATIONS: "32"
          KATACAT_M341_CURRENT_MS: "75"
          KATACAT_M341_MAX_MOVES: "90"
          KATACAT_M341_CAPTURE_DEPTH: "7"
          KATACAT_M341_NEGATIVE_SCAN_LIMIT: "12"
          KATACAT_M341_NEGATIVE_SCAN_MS: "50"
          KATACAT_M341_TEACHER_VERIFY_MS: "100"
          KATACAT_M341_MAX_SAMPLES_PER_GAME: "8"
          KATACAT_M341_OUTPUT_DIR: katacat-m36-hard-negative
        run: npm run katacat:m341-hard-negative

      - name: Validate larger hard-negative source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("katacat-m36-hard-negative/summary.json").read_text())
          assert summary["acceptance"]["passed"] is True
          samples = [line for line in Path("katacat-m36-hard-negative/katacat-m341-hard-negative-samples.jsonl").read_text().splitlines() if line.strip()]
          assert len(samples) >= 300, len(samples)
          assert summary.get("gamesRequested", 256) == 256 or summary.get("games", 256) == 256
          PY

      - name: Re-run actual-loss fallback regressions
        env:
          KATACAT_M341_REGRESSION_FIXTURE: katacat-m36-hard-negative/katacat-m341-regression-fixtures.json
          KATACAT_M341_REGRESSION_OUTPUT: katacat-m36-regression/summary.json
        run: |
          mkdir -p katacat-m36-regression
          npm run katacat:m341-fallback

      - name: Train bounded residual adapter
        run: >-
          python ml/train_katacat_m36.py
          --bootstrap-data=m33-source-artifact/katacat-m0-output/katacat-samples.jsonl
          --selfplay-data=m33-source-artifact/katacat-m3-output/katacat-selfplay-samples.jsonl
          --mixed-data=m33-source-artifact/katacat-m33-mixed/katacat-m33-mixed-samples.jsonl
          --curriculum-data=m33-source-artifact/katacat-m33-curriculum/katacat-m33-curriculum-samples.jsonl
          --hard-negative-data=katacat-m36-hard-negative/katacat-m341-hard-negative-samples.jsonl
          --init-checkpoint=prepared-artifact/katacat-m341-model/katacat-m341.pt
          --out=katacat-m36-model
          --epochs=16
          --adapter-channels=8
          --max-abs-delta=1.0
          --learning-rate=0.0002
          --pairwise-weight=2.0
          --negative-mass-weight=0.5
          --general-kl-weight=4.0
          --general-residual-weight=1.0
          --replay-policy-weight=0.15
          --hard-sampling-multiplier=6.0
          --commit-sha=${KATACAT_M36_COMMIT_SHA}
          --device=cpu
          --augment=on

      - name: Validate selected adapter checkpoint
        run: |
          python - <<'PY'
          import hashlib, json, torch
          from pathlib import Path
          from katacat_m36_adapter import load_m36_checkpoint
          summary = json.loads(Path("katacat-m36-model/summary.json").read_text())
          assert summary["acceptance"]["passed"] is True
          assert summary["trainableScope"] == "RESIDUAL_POLICY_ADAPTER_ONLY"
          assert summary["acceptance"]["baseModelFrozen"] is True
          assert summary["acceptance"]["largerHardNegativeSource"] is True
          assert summary["selected"]["frozenTacticalValidation"]["regressionFailuresVsParent"] == 0
          candidate = Path("katacat-m36-model/katacat-m36.pt")
          assert hashlib.sha256(candidate.read_bytes()).hexdigest() == summary["selected_checkpoint_sha256"]
          loaded = load_m36_checkpoint(candidate)
          assert loaded.checkpoint["stage"] == "M3.6_RESIDUAL_POLICY_ADAPTER"
          PY

      - name: Record manifest and checkpoint hashes
        shell: bash
        run: |
          PARENT_SHA=$(sha256sum prepared-artifact/katacat-m341-model/katacat-m341.pt | awk '{print $1}')
          CANDIDATE_SHA=$(sha256sum katacat-m36-model/katacat-m36.pt | awk '{print $1}')
          echo "KATACAT_M36_PARENT_CHECKPOINT_SHA256=$PARENT_SHA" >> "$GITHUB_ENV"
          echo "KATACAT_M36_CANDIDATE_CHECKPOINT_SHA256=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          python - <<PY
          import json
          from pathlib import Path
          model = json.loads(Path("katacat-m36-model/summary.json").read_text())
          Path("katacat-m36-manifest.json").write_text(json.dumps({
              "schemaVersion": 1,
              "stage": "M3.6_MANIFEST",
              "sourceM341RunId": "${KATACAT_M36_SOURCE_M341_RUN_ID}",
              "sourceM33RunId": "${KATACAT_M36_SOURCE_M33_RUN_ID}",
              "commitSha": "${KATACAT_M36_COMMIT_SHA}",
              "parentCheckpointSha256": "$PARENT_SHA",
              "candidateCheckpointSha256": "$CANDIDATE_SHA",
              "selectedEpoch": model["selected_epoch"],
              "improvedOverParent": model["improved_over_parent"],
              "behaviorEquivalentToParent": model["behaviorEquivalentToParent"],
          }, indent=2) + "\n")
          PY

      - name: Run 32-game smoke per opponent
        env:
          RUN_KATACAT_M36_ARENA: "1"
          KATACAT_M36_CANDIDATE_CHECKPOINT: katacat-m36-model/katacat-m36.pt
          KATACAT_M36_PARENT_CHECKPOINT: prepared-artifact/katacat-m341-model/katacat-m341.pt
          KATACAT_M36_PHASE: smoke
          KATACAT_M36_GAMES_PER_COMPARISON: "32"
          KATACAT_M36_ARENA_OUTPUT_DIR: katacat-m36-smoke
        run: npm run katacat:m36-arena

      - name: Evaluate smoke gate
        id: smoke_gate
        run: >-
          npm run katacat:m36-gate --
          --phase=smoke
          --training=katacat-m36-model/summary.json
          --regression=katacat-m36-regression/summary.json
          --arena=katacat-m36-smoke/arena-summary.json
          --source-development=katacat-m36-source-development.json
          --output=katacat-m36-gates/smoke.json

      - name: Add smoke summary
        if: always()
        run: |
          echo "## KataCat M3.6 Prepare + Smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: ${KATACAT_M36_COMMIT_SHA:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- source M3.4.1 run: ${KATACAT_M36_SOURCE_M341_RUN_ID:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- smoke pass: ${{ steps.smoke_gate.outputs.passed }}" >> "$GITHUB_STEP_SUMMARY"
          for report in katacat-m36-hard-negative/summary.json katacat-m36-regression/summary.json \
            katacat-m36-model/summary.json katacat-m36-manifest.json \
            katacat-m36-smoke/arena-summary.json katacat-m36-gates/smoke.json; do
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "### $report" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            test -f "$report" && cat "$report" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload prepared M3.6 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katacat-m36-prepared-${{ github.run_id }}
          retention-days: 14
          path: |
            prepared-artifact/katacat-m341-model/katacat-m341.pt
            katacat-m36-source-development.json
            katacat-m36-hard-negative/
            katacat-m36-regression/
            katacat-m36-model/
            katacat-m36-manifest.json
            katacat-m36-smoke/
            katacat-m36-gates/smoke.json
          if-no-files-found: warn

  development:
    name: Run 128-game M3.6 development evaluation
    needs: prepare_smoke
    if: needs.prepare_smoke.outputs.smoke_pass == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      development_pass: ${{ steps.development_gate.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/katacat-m36
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements-katacat.txt
      - run: pip install -r ml/requirements-katacat.txt
      - uses: actions/download-artifact@v4
        with:
          name: katacat-m36-prepared-${{ github.run_id }}
          path: .
      - name: Restore manifest environment
        run: |
          echo "KATACAT_M36_COMMIT_SHA=$(jq -r .commitSha katacat-m36-manifest.json)" >> "$GITHUB_ENV"
          echo "KATACAT_M36_PARENT_CHECKPOINT_SHA256=$(jq -r .parentCheckpointSha256 katacat-m36-manifest.json)" >> "$GITHUB_ENV"
          echo "KATACAT_M36_CANDIDATE_CHECKPOINT_SHA256=$(jq -r .candidateCheckpointSha256 katacat-m36-manifest.json)" >> "$GITHUB_ENV"
      - name: Run 128 games per opponent
        env:
          RUN_KATACAT_M36_ARENA: "1"
          KATACAT_M36_CANDIDATE_CHECKPOINT: katacat-m36-model/katacat-m36.pt
          KATACAT_M36_PARENT_CHECKPOINT: prepared-artifact/katacat-m341-model/katacat-m341.pt
          KATACAT_M36_PHASE: development
          KATACAT_M36_GAMES_PER_COMPARISON: "128"
          KATACAT_M36_ARENA_OUTPUT_DIR: katacat-m36-development
        run: npm run katacat:m36-arena
      - name: Evaluate development gate
        id: development_gate
        run: >-
          npm run katacat:m36-gate --
          --phase=development
          --training=katacat-m36-model/summary.json
          --regression=katacat-m36-regression/summary.json
          --arena=katacat-m36-development/arena-summary.json
          --source-development=katacat-m36-source-development.json
          --output=katacat-m36-gates/development.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: katacat-m36-development-${{ github.run_id }}
          retention-days: 14
          path: |
            katacat-m36-development/
            katacat-m36-gates/development.json
          if-no-files-found: warn

  promotion:
    name: Run 400-game M3.6 promotion evaluation
    needs: [prepare_smoke, development]
    if: needs.development.outputs.development_pass == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/katacat-m36
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements-katacat.txt
      - run: pip install -r ml/requirements-katacat.txt
      - uses: actions/download-artifact@v4
        with:
          name: katacat-m36-prepared-${{ github.run_id }}
          path: .
      - name: Restore manifest environment
        run: |
          echo "KATACAT_M36_COMMIT_SHA=$(jq -r .commitSha katacat-m36-manifest.json)" >> "$GITHUB_ENV"
          echo "KATACAT_M36_PARENT_CHECKPOINT_SHA256=$(jq -r .parentCheckpointSha256 katacat-m36-manifest.json)" >> "$GITHUB_ENV"
          echo "KATACAT_M36_CANDIDATE_CHECKPOINT_SHA256=$(jq -r .candidateCheckpointSha256 katacat-m36-manifest.json)" >> "$GITHUB_ENV"
      - name: Run 400 games per opponent
        env:
          RUN_KATACAT_M36_ARENA: "1"
          KATACAT_M36_CANDIDATE_CHECKPOINT: katacat-m36-model/katacat-m36.pt
          KATACAT_M36_PARENT_CHECKPOINT: prepared-artifact/katacat-m341-model/katacat-m341.pt
          KATACAT_M36_PHASE: promotion
          KATACAT_M36_GAMES_PER_COMPARISON: "400"
          KATACAT_M36_ARENA_OUTPUT_DIR: katacat-m36-promotion
        run: npm run katacat:m36-arena
      - name: Evaluate promotion gate
        run: >-
          npm run katacat:m36-gate --
          --phase=promotion
          --training=katacat-m36-model/summary.json
          --regression=katacat-m36-regression/summary.json
          --arena=katacat-m36-promotion/arena-summary.json
          --source-development=katacat-m36-source-development.json
          --output=katacat-m36-gates/promotion.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: katacat-m36-promotion-${{ github.run_id }}
          retention-days: 14
          path: |
            katacat-m36-promotion/
            katacat-m36-gates/promotion.json
          if-no-files-found: warn
