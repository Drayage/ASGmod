name: KataCat M3.1

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "M3.1 코드를 실행할 브랜치 또는 커밋"
        required: true
        default: "feat/katacat-m31"
        type: string
      mixed_games:
        description: "latest/champion/CURRENT 혼합 대국 수 (최소 5)"
        required: true
        default: "5"
        type: string
      mixed_simulations:
        description: "혼합 데이터 PUCT simulation 수"
        required: true
        default: "48"
        type: string
      candidate_epochs:
        description: "M3.1 혼합 재학습 epoch"
        required: true
        default: "4"
        type: string
      arena_games_per_opponent:
        description: "재검증 상대별 미러 게임 수"
        required: true
        default: "8"
        type: string
      arena_simulations:
        description: "재검증 PUCT simulation 수"
        required: true
        default: "32"
        type: string

permissions:
  contents: read

jobs:
  katacat-m31:
    name: Add tactical shell, mix teachers, retrain, and rerun arena
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Verify PUCT core and tactical floor
        run: npm run katacat:m2-core

      - name: Generate fixed M0 bootstrap data
        run: |
          npm run katacat:generate -- \
            --games=20 \
            --teacher-ms=100 \
            --max-per-bucket=24 \
            --territory-pass-ply=56 \
            --output=katacat-m0-output

      - name: Validate M0 replay and coverage
        run: |
          npm run katacat:validate -- \
            --output=katacat-m0-output \
            --strict=true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements-katacat.txt

      - name: Install Python dependencies
        run: pip install -r ml/requirements-katacat.txt

      - name: Train previous champion bootstrap
        run: |
          python ml/train_katacat_m1.py \
            --data=katacat-m0-output/katacat-samples.jsonl \
            --out=katacat-m1-output \
            --epochs=8 \
            --channels=96 \
            --blocks=8 \
            --device=cpu \
            --augment=on

      - name: Generate original M3 PUCT self-play
        run: |
          npm run katacat:m3-selfplay -- \
            --checkpoint=katacat-m1-output/katacat-m1.pt \
            --games=4 \
            --simulations=64 \
            --max-moves=90 \
            --temperature-moves=12 \
            --noise-alpha=0.3 \
            --noise-fraction=0.25 \
            --output=katacat-m3-output

      - name: Train initial M3 candidate
        run: |
          python ml/train_katacat_m3.py \
            --bootstrap-data=katacat-m0-output/katacat-samples.jsonl \
            --selfplay-data=katacat-m3-output/katacat-selfplay-samples.jsonl \
            --init-checkpoint=katacat-m1-output/katacat-m1.pt \
            --out=katacat-m3-model \
            --epochs=4 \
            --device=cpu \
            --augment=on

      - name: Generate M3.1 mixed tactical data
        run: |
          npm run katacat:m31-mixed -- \
            --latest=katacat-m3-model/katacat-m3.pt \
            --champion=katacat-m1-output/katacat-m1.pt \
            --games="${{ inputs.mixed_games }}" \
            --simulations="${{ inputs.mixed_simulations }}" \
            --current-ms=50 \
            --max-moves=90 \
            --capture-depth=7 \
            --capture-attack-ms=25 \
            --capture-defense-ms=50 \
            --capture-defense-limit=12 \
            --output=katacat-m31-output

      - name: Train M3.1 candidate from all sources
        run: |
          python ml/train_katacat_m3.py \
            --bootstrap-data=katacat-m0-output/katacat-samples.jsonl \
            --selfplay-data=katacat-m3-output/katacat-selfplay-samples.jsonl \
            --mixed-data=katacat-m31-output/katacat-m31-samples.jsonl \
            --init-checkpoint=katacat-m3-model/katacat-m3.pt \
            --out=katacat-m31-model \
            --epochs="${{ inputs.candidate_epochs }}" \
            --device=cpu \
            --augment=on

      - name: Rerun mirrored arena with candidate tactical shell
        env:
          RUN_KATACAT_M31_ARENA: "1"
          KATACAT_M31_CANDIDATE_CHECKPOINT: katacat-m31-model/katacat-m3.pt
          KATACAT_M31_CHAMPION_CHECKPOINT: katacat-m1-output/katacat-m1.pt
          KATACAT_M31_GAMES_PER_OPPONENT: ${{ inputs.arena_games_per_opponent }}
          KATACAT_M31_SIMULATIONS: ${{ inputs.arena_simulations }}
          KATACAT_M31_CURRENT_MS: "50"
          KATACAT_M31_MAX_MOVES: "90"
          KATACAT_M31_CAPTURE_DEPTH: "7"
          KATACAT_M31_CAPTURE_ATTACK_MS: "25"
          KATACAT_M31_CAPTURE_DEFENSE_MS: "50"
          KATACAT_M31_CAPTURE_DEFENSE_LIMIT: "12"
          KATACAT_M31_OUTPUT_DIR: katacat-m31-output
        run: npm run katacat:m31-arena

      - name: Add reports to summary
        if: always()
        shell: bash
        run: |
          {
            echo "## KataCat M3.1"
            echo
            echo "- Ref: \`${{ inputs.ref }}\`"
            echo "- Mixed games: \`${{ inputs.mixed_games }}\`"
            echo "- Mixed simulations: \`${{ inputs.mixed_simulations }}\`"
            echo "- Candidate epochs: \`${{ inputs.candidate_epochs }}\`"
            echo "- Arena games/opponent: \`${{ inputs.arena_games_per_opponent }}\`"
            echo "- Arena simulations: \`${{ inputs.arena_simulations }}\`"
            echo
            for item in \
              katacat-m31-output/summary.json \
              katacat-m31-model/summary.json \
              katacat-m31-output/arena-summary.json; do
              if [ -f "$item" ]; then
                echo "### $item"
                echo '```json'
                cat "$item"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload KataCat M3.1 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katacat-m31-${{ github.run_id }}
          path: |
            katacat-m0-output/
            katacat-m1-output/
            katacat-m3-output/
            katacat-m3-model/
            katacat-m31-output/
            katacat-m31-model/
          if-no-files-found: warn
