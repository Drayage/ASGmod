name: Ownership Learning POC

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "데이터 생성과 학습을 실행할 브랜치 또는 커밋"
        required: true
        default: "feat/ownership-learning-poc"
        type: string
      games:
        description: "조용한 영역 학습 대국 수"
        required: true
        default: "12"
        type: string
      teacher_ms:
        description: "CURRENT 교사 한 수당 제한 시간(ms)"
        required: true
        default: "300"
        type: string
      epochs:
        description: "소형 신경망 학습 epoch"
        required: true
        default: "8"
        type: string

permissions:
  contents: read

jobs:
  ownership-learning:
    name: Generate dataset and train ownership model
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Generate quiet ownership dataset
        run: |
          npm run dataset:ownership -- \
            --games="${{ inputs.games }}" \
            --teacher-ms="${{ inputs.teacher_ms }}" \
            --output=ownership-dataset.jsonl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Train ownership and margin model
        run: |
          python ml/train_ownership.py \
            --data ownership-dataset.jsonl \
            --out ownership-training \
            --epochs="${{ inputs.epochs }}" \
            --device=cpu

      - name: Add result to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Ownership Learning POC"
            echo
            echo "- Ref: \`${{ inputs.ref }}\`"
            echo "- Games: \`${{ inputs.games }}\`"
            echo "- Teacher budget: \`${{ inputs.teacher_ms }} ms\`"
            echo "- Epochs: \`${{ inputs.epochs }}\`"
            echo
            if [ -f ownership-dataset.meta.json ]; then
              echo "### Dataset"
              echo '```json'
              cat ownership-dataset.meta.json
              echo '```'
            fi
            if [ -f ownership-training/summary.json ]; then
              echo "### Training"
              echo '```json'
              cat ownership-training/summary.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dataset and model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ownership-learning-${{ github.run_number }}
          path: |
            ownership-dataset.jsonl
            ownership-dataset.meta.json
            ownership-training/
          if-no-files-found: ignore
