name: Alley Boss Cats territory arena baseline

on:
  push:
    branches: [main]
    paths:
      - ai-arena.mts
      - src/games/alley-boss-cats/arenaMetrics.ts
      - .github/workflows/alley-boss-cats-arena-baseline.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alley-boss-cats-territory-baseline-main
  cancel-in-progress: false

jobs:
  baseline:
    name: 128-game mirrored VERY_HARD baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record source commit
        shell: bash
        run: echo "ARENA_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deployed-engine territory baseline
        shell: bash
        env:
          ONLY: BASELINE
          GAMES: "128"
          HARD_MS: "3000"
          VERY_HARD_MS: "3000"
          MAX_PLIES: "160"
          OPENING_PLIES: "4"
          ARENA_SEED: "20260804"
          OUTPUT_JSON: artifacts/alley-boss-cats-ai-arena/baseline.json
        run: |
          set -euo pipefail
          mkdir -p artifacts/alley-boss-cats-ai-arena
          npx vite-node ai-arena.mts

      - name: Validate baseline contract
        shell: bash
        run: |
          set -euo pipefail
          JSON=artifacts/alley-boss-cats-ai-arena/baseline.json
          test -f "$JSON"
          jq -e '
            .stage == "PHASE_0_TERRITORY_ARENA_BASELINE" and
            .primaryMetric == "finalTerritoryMargin" and
            .mlCodeAdded == false and
            .searchOrGuardChanged == false and
            .tuningChanged == false and
            .config.gamesPerMatch == 128 and
            .config.maxPlies == 160 and
            .config.veryHardMs == 3000 and
            .config.mirrored == true and
            (.matches | length) == 1 and
            .matches[0].engines.X == "VERY_HARD" and
            .matches[0].engines.Y == "VERY_HARD" and
            .matches[0].timeBudgetMs.X == 3000 and
            .matches[0].timeBudgetMs.Y == 3000 and
            .matches[0].aggregate.games == 128 and
            .matches[0].aggregate.primaryMetric.summary.mean != null and
            .matches[0].aggregate.primaryMetric.summary.standardDeviation != null and
            .matches[0].aggregate.primaryMetric.summary.confidence95.low != null and
            .matches[0].aggregate.primaryMetric.summary.confidence95.high != null
          ' "$JSON" >/dev/null

      - name: Add arena result to job summary
        if: always()
        shell: bash
        run: |
          echo "## 골목대냥 Phase 0 영역 아레나 기준선" >> "$GITHUB_STEP_SUMMARY"
          echo "- source commit: \`${ARENA_SOURCE_COMMIT:-unknown}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- engine budget: 3000ms vs 3000ms" >> "$GITHUB_STEP_SUMMARY"
          echo "- games: 128 mirrored, max 160 plies" >> "$GITHUB_STEP_SUMMARY"
          JSON=artifacts/alley-boss-cats-ai-arena/baseline.json
          if [ -f "$JSON" ]; then
            territory_count=$(jq -r '.matches[0].aggregate.outcomes.reasons.TERRITORY' "$JSON")
            territory_rate=$(jq -r '.matches[0].aggregate.outcomes.territoryDecisionRatePercent' "$JSON")
            margin_mean=$(jq -r '.matches[0].aggregate.primaryMetric.summary.mean' "$JSON")
            margin_sd=$(jq -r '.matches[0].aggregate.primaryMetric.summary.standardDeviation' "$JSON")
            margin_low=$(jq -r '.matches[0].aggregate.primaryMetric.summary.confidence95.low' "$JSON")
            margin_high=$(jq -r '.matches[0].aggregate.primaryMetric.summary.confidence95.high' "$JSON")
            echo "- **영역 결판: ${territory_count}/128 (${territory_rate}%)**" >> "$GITHUB_STEP_SUMMARY"
            echo "- **영역 마진: 평균 ${margin_mean}칸, SD ${margin_sd}, 95% CI [${margin_low}, ${margin_high}]**" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            jq '.matches[0] | {label, engines, timeBudgetMs, aggregate}' "$JSON" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- baseline JSON was not produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload complete arena JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alley-boss-cats-territory-baseline-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: artifacts/alley-boss-cats-ai-arena/baseline.json

      - name: Persist baseline and commit core numbers
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          JSON=artifacts/alley-boss-cats-ai-arena/baseline.json
          mkdir -p docs
          jq --arg sourceCommit "$ARENA_SOURCE_COMMIT" --arg runUrl "$RUN_URL" '
            {
              schemaVersion,
              stage,
              generatedAt,
              sourceCommit: $sourceCommit,
              workflowRun: $runUrl,
              primaryMetric,
              config,
              baseline: (.matches[0] | {label, engines, timeBudgetMs, aggregate})
            }
          ' "$JSON" > docs/alley-boss-cats-ai-arena-baseline.json

          territory_count=$(jq -r '.matches[0].aggregate.outcomes.reasons.TERRITORY' "$JSON")
          territory_rate=$(jq -r '.matches[0].aggregate.outcomes.territoryDecisionRatePercent' "$JSON")
          capture_count=$(jq -r '.matches[0].aggregate.outcomes.reasons.CAPTURE' "$JSON")
          capture_rate=$(jq -r '.matches[0].aggregate.outcomes.captureDecisionRatePercent' "$JSON")
          ply_cap_count=$(jq -r '.matches[0].aggregate.outcomes.reasons.PLY_CAP' "$JSON")
          margin_mean=$(jq -r '.matches[0].aggregate.primaryMetric.summary.mean' "$JSON")
          margin_sd=$(jq -r '.matches[0].aggregate.primaryMetric.summary.standardDeviation' "$JSON")
          margin_low=$(jq -r '.matches[0].aggregate.primaryMetric.summary.confidence95.low' "$JSON")
          margin_high=$(jq -r '.matches[0].aggregate.primaryMetric.summary.confidence95.high' "$JSON")
          first_x=$(jq -r '.matches[0].aggregate.firstTerritoryTurn.X.mean' "$JSON")
          first_y=$(jq -r '.matches[0].aggregate.firstTerritoryTurn.Y.mean' "$JSON")
          peak_x=$(jq -r '.matches[0].aggregate.peakInfluence.X.mean' "$JSON")
          peak_y=$(jq -r '.matches[0].aggregate.peakInfluence.Y.mean' "$JSON")
          final_x=$(jq -r '.matches[0].aggregate.finalTerritory.X.mean' "$JSON")
          final_y=$(jq -r '.matches[0].aggregate.finalTerritory.Y.mean' "$JSON")
          conversion_x=$(jq -r '.matches[0].aggregate.influenceToTerritoryConversionPercent.X.ratioOfMeans' "$JSON")
          conversion_y=$(jq -r '.matches[0].aggregate.influenceToTerritoryConversionPercent.Y.ratioOfMeans' "$JSON")
          mean_plies=$(jq -r '.matches[0].aggregate.plies.mean' "$JSON")

          printf '%s\n' \
            'chore(ai): record classic territory arena baseline' \
            '' \
            'VERY_HARD self-play baseline: 128 mirrored games, 3000ms vs 3000ms, 160-ply cap.' \
            '' \
            "- territory decisions: ${territory_count}/128 (${territory_rate}%)" \
            "- capture decisions: ${capture_count}/128 (${capture_rate}%)" \
            "- ply-cap decisions: ${ply_cap_count}/128" \
            "- final territory margin: mean ${margin_mean} cells, SD ${margin_sd}, 95% CI [${margin_low}, ${margin_high}]" \
            "- first territory turn: X ${first_x}, Y ${first_y}" \
            "- peak influence: X ${peak_x}, Y ${peak_y}" \
            "- final territory: X ${final_x}, Y ${final_y}" \
            "- influence-to-territory conversion: X ${conversion_x}%, Y ${conversion_y}%" \
            "- mean game length: ${mean_plies} plies" \
            '' \
            "Source commit: ${ARENA_SOURCE_COMMIT}" \
            "Workflow: ${RUN_URL}" \
            > /tmp/arena-commit-message.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/alley-boss-cats-ai-arena-baseline.json
          git commit -F /tmp/arena-commit-message.txt
          git push origin HEAD:main
