name: Ownership dataset (Phase 1)

# Generates final-ownership labels and measures what the shipped heuristic
# scores against them. No model is trained here and nothing touches play.
#
# Sharded because the 128-game arena baseline took 3h27m in one job: a single
# job cannot generate a dataset inside the 6h limit, and a pilot needs to come
# back in minutes so a broken pipeline is not discovered five hours in. A local
# 200-game run across four shards took 13 minutes.

on:
  workflow_dispatch:
    inputs:
      games:
        description: "Total self-play games (200 = pilot). Must divide evenly by shards"
        required: true
        default: "200"
        type: string
      shards:
        description: "Parallel jobs to split the games across"
        required: true
        default: "8"
        type: string
      budget_ms:
        description: "Search budget per move. Volume matters here, not peak strength"
        required: true
        default: "400"
        type: string
      validation_games:
        description: "Recorded human games held out for validation, never trained on"
        required: true
        default: "20"
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: Plan shards
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      games_per_shard: ${{ steps.plan.outputs.games_per_shard }}
    steps:
      - name: Split the games across shards
        id: plan
        run: |
          set -euo pipefail
          GAMES="${{ inputs.games }}"
          COUNT="${{ inputs.shards }}"
          for value in "$GAMES" "$COUNT"; do
            if ! [[ "$value" =~ ^[0-9]+$ ]] || [ "$value" -lt 1 ]; then
              echo "games and shards must be positive integers, got '$value'" >&2
              exit 1
            fi
          done
          if [ $((GAMES % COUNT)) -ne 0 ]; then
            # Each shard runs a fixed count and offsets its global game numbers
            # by shard index, so an uneven split would silently change the total.
            echo "$GAMES games does not divide evenly across $COUNT shards" >&2
            exit 1
          fi
          echo "shards=$(seq 0 $((COUNT - 1)) | jq -R . | jq -sc 'map(tonumber)')" >> "$GITHUB_OUTPUT"
          echo "games_per_shard=$((GAMES / COUNT))" >> "$GITHUB_OUTPUT"

  selfplay:
    name: Self-play shard ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Generate labelled positions
        run: |
          set -euo pipefail
          mkdir -p ownership-shards
          npx vite-node scripts/generate-ownership-dataset.ts -- \
            --mode=selfplay \
            --games=${{ needs.plan.outputs.games_per_shard }} \
            --shard-index=${{ matrix.shard }} \
            --budget-ms=${{ inputs.budget_ms }} \
            --output-dir=ownership-shards \
            > /dev/null

      - name: Refuse a shard that produced nothing
        run: |
          set -euo pipefail
          META=ownership-shards/selfplay-shard-${{ matrix.shard }}-meta.json
          test -s ownership-shards/selfplay-shard-${{ matrix.shard }}-base.jsonl
          jq -e '.games > 0 and .split == "TRAIN"' "$META" > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: ownership-shard-${{ matrix.shard }}
          path: ownership-shards/
          retention-days: 14

  validation:
    name: Human validation set
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Label the recorded human games
        run: |
          set -euo pipefail
          mkdir -p ownership-shards
          npx vite-node scripts/generate-ownership-dataset.ts -- \
            --mode=human \
            --games=${{ inputs.validation_games }} \
            --budget-ms=${{ inputs.budget_ms }} \
            --output-dir=ownership-shards \
            > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: ownership-validation
          path: ownership-shards/
          retention-days: 14

  aggregate:
    name: Aggregate and report the bar
    needs: [plan, selfplay, validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: ownership-*
          path: ownership-shards
          merge-multiple: true

      - name: Aggregate
        run: |
          set -euo pipefail
          # The aggregator refuses a missing shard, a duplicate game id, or any
          # game appearing in both splits, so a silently failed shard cannot
          # become a quietly smaller sample.
          node scripts/aggregate-ownership-dataset.mjs \
            --input-dir=ownership-shards \
            --output-dir=ownership-pilot \
            --expected-train-games=${{ inputs.games }} \
            --expected-validation-games=${{ inputs.validation_games }} \
            --expected-train-shards=${{ inputs.shards }}

      - name: Add dataset report to summary
        if: always()
        run: |
          {
            echo "## Ownership dataset (Phase 1)"
            echo
            echo "- \`${{ inputs.games }}\` self-play games across \`${{ inputs.shards }}\` shards, \`${{ inputs.budget_ms }} ms\` per move"
            echo "- \`${{ inputs.validation_games }}\` recorded human games held out, never trained on"
            echo
            echo "### The bar a model has to beat"
            echo
            echo "Read the open-point column. Roughly five in six points end up"
            echo "nobody's, so whole-board accuracy is mostly free credit and"
            echo "\`alwaysNeutral\` outscores the signal the engine actually uses"
            echo "while saying nothing at all. Precision is what has to move:"
            echo "influence finds most of the territory that forms and is wrong"
            echo "about more than two thirds of what it claims."
            echo
            for split in train validation; do
              echo "**$split**"
              echo
              echo '| baseline | open pts | recall | precision |'
              echo '|---|---|---|---|'
              jq -r --arg s "$split" '.[$s].baselines | to_entries[] |
                def pct: if . == null then "—" else (. * 100 * 100 | round / 100 | tostring) + "%" end;
                "| \(.key) | \(.value.openAccuracy | pct) | \(.value.territoryRecall | pct) | \(.value.territoryPrecision | pct) |"' \
                ownership-pilot/ownership-pilot-summary.json
              echo
            done
            echo "### Full summary"
            echo '```json'
            cat ownership-pilot/ownership-pilot-summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ownership-dataset
          path: ownership-pilot/
          retention-days: 14
