name: MCTS Arena

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "대전을 실행할 브랜치 또는 커밋"
        required: true
        default: "feat/hybrid-mcts-experiment"
        type: string
      games:
        description: "자동대전 판수 (짝수 권장)"
        required: true
        default: "4"
        type: string
      move_ms:
        description: "한 수당 제한 시간(ms)"
        required: true
        default: "300"
        type: string

permissions:
  contents: read

jobs:
  arena:
    name: CURRENT vs HYBRID_MCTS
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run MCTS arena
        shell: bash
        run: |
          set -o pipefail
          npm run arena:mcts -- --games="${{ inputs.games }}" --move-ms="${{ inputs.move_ms }}" | tee mcts-arena.txt

      - name: Add result to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MCTS Arena Result"
            echo
            echo "- Ref: \`${{ inputs.ref }}\`"
            echo "- Games: \`${{ inputs.games }}\`"
            echo "- Move limit: \`${{ inputs.move_ms }} ms\`"
            echo
            echo '```text'
            if [ -f mcts-arena.txt ]; then
              cat mcts-arena.txt
            else
              echo "Arena output was not created. Check the failed step logs."
            fi
            echo '```'
            echo
            if [ -f mcts-arena.json ]; then
              echo "Detailed move-by-move replay data is attached as \`mcts-arena.json\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload arena logs and replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcts-arena-${{ github.run_number }}
          path: |
            mcts-arena.txt
            mcts-arena.json
          if-no-files-found: ignore
