name: KataCat M3.7.2.1 128-game diagnostic

on:
  workflow_dispatch:
    inputs:
      source_m372_run_id:
        description: "Successful KataCat M3.7.2 run ID; blank selects latest"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

env:
  KATACAT_M341_SIMULATIONS: "32"
  KATACAT_M341_CURRENT_MS: "50"
  KATACAT_M341_MAX_MOVES: "90"
  KATACAT_M341_CAPTURE_DEPTH: "7"
  KATACAT_M341_CAPTURE_ATTACK_MS: "25"
  KATACAT_M341_CAPTURE_DEFENSE_MS: "50"
  KATACAT_M341_CAPTURE_DEFENSE_LIMIT: "12"
  KATACAT_M341_FINAL_VERIFY_MS: "75"
  KATACAT_M341_FINAL_VERIFY_LIMIT: "5"
  KATACAT_M341_RESCUE_CURRENT_MS: "50"
  KATACAT_M341_RESCUE_VERIFY_MS: "50"
  KATACAT_M341_RESCUE_VERIFY_LIMIT: "8"
  KATACAT_M341_RESCUE_TOTAL_MS: "450"
  KATACAT_M341_EXHAUSTIVE_VERIFY_MS: "25"

jobs:
  diagnostic:
    name: Run fixed-checkpoint 128-game diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 420

    steps:
      - name: Checkout M3.7.2.1 diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: feat/katacat-m3721

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements-katacat.txt
      - run: pip install -r ml/requirements-katacat.txt

      - name: Verify diagnostic code
        run: |
          npm run build
          node --check scripts/summarize-katacat-m3721.mjs

      - name: Download selected M3.7.2 checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.source_m372_run_id }}
        run: |
          set -euo pipefail
          M372_RUN_ID="$REQUESTED_RUN_ID"
          if [ -z "$M372_RUN_ID" ]; then
            M372_RUN_ID=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/katacat-m372.yml/runs?status=success&per_page=20" \
              --jq '.workflow_runs[0].id')
          fi
          test -n "$M372_RUN_ID" && test "$M372_RUN_ID" != "null"
          mkdir -p source-m372
          gh run download "$M372_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "katacat-m372-prepared-${M372_RUN_ID}" --dir source-m372
          test -f source-m372/katacat-m372-model/katacat-m372.pt
          test -f source-m372/katacat-m372-model/summary.json
          test -f source-m372/katacat-m372-gates/smoke.json
          test -f source-m372/source-m371/source-m36/prepared-artifact/katacat-m341-model/katacat-m341.pt
          jq -e '.selected_epoch > 0 and .improved_over_parent == true and .selected.maxPolicyLogitDelta == 0 and .selected.frozenTacticalValidation.regressionFailuresVsParent == 0' \
            source-m372/katacat-m372-model/summary.json >/dev/null
          echo "KATACAT_M3721_SOURCE_RUN_ID=$M372_RUN_ID" >> "$GITHUB_ENV"

      - name: Run 128 games per comparison
        env:
          RUN_KATACAT_M341_ARENA: "1"
          KATACAT_M341_CANDIDATE_CHECKPOINT: source-m372/katacat-m372-model/katacat-m372.pt
          KATACAT_M341_PARENT_CHECKPOINT: source-m372/source-m371/source-m36/prepared-artifact/katacat-m341-model/katacat-m341.pt
          KATACAT_M341_PHASE: m3721-diagnostic
          KATACAT_M341_GAMES_PER_COMPARISON: "128"
          KATACAT_M341_ARENA_OUTPUT_DIR: katacat-m3721-diagnostic
        run: npm run katacat:m341-arena

      - name: Summarize diagnostic evidence
        run: >-
          node scripts/summarize-katacat-m3721.mjs
          --training=source-m372/katacat-m372-model/summary.json
          --sourceSmoke=source-m372/katacat-m372-gates/smoke.json
          --arena=katacat-m3721-diagnostic/arena-summary.json
          --output=katacat-m3721-diagnostic/diagnostic-summary.json

      - name: Add diagnostic summary
        if: always()
        shell: bash
        run: |
          echo "## KataCat M3.7.2.1 128-game diagnostic" >> "$GITHUB_STEP_SUMMARY"
          echo "- source M3.7.2 run: ${KATACAT_M3721_SOURCE_RUN_ID:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          for report in \
            source-m372/katacat-m372-model/summary.json \
            source-m372/katacat-m372-gates/smoke.json \
            katacat-m3721-diagnostic/arena-summary.json \
            katacat-m3721-diagnostic/diagnostic-summary.json; do
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "### $report" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            test -f "$report" && cat "$report" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload M3.7.2.1 diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katacat-m3721-diagnostic-${{ github.run_id }}
          retention-days: 14
          path: |
            source-m372/katacat-m372-model/summary.json
            source-m372/katacat-m372-gates/smoke.json
            katacat-m3721-diagnostic/
          if-no-files-found: warn
