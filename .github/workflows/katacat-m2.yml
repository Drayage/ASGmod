name: KataCat M2

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "M2 코드를 실행할 브랜치 또는 커밋"
        required: true
        default: "feat/katacat-m2"
        type: string
      games:
        description: "M0 완결 대국 수"
        required: true
        default: "20"
        type: string
      teacher_ms:
        description: "CURRENT 교사 한 수당 제한 시간(ms)"
        required: true
        default: "100"
        type: string
      epochs:
        description: "M1 bootstrap 학습 epoch"
        required: true
        default: "8"
        type: string
      simulations:
        description: "M2 루트당 PUCT simulation 수"
        required: true
        default: "16"
        type: string

permissions:
  contents: read

jobs:
  katacat-m2:
    name: Train M1 and run rules-engine neural PUCT
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Verify PUCT core and tactical guards
        run: npm run katacat:m2-core

      - name: Generate M0 replay data
        run: |
          npm run katacat:generate -- \
            --games="${{ inputs.games }}" \
            --teacher-ms="${{ inputs.teacher_ms }}" \
            --max-per-bucket=24 \
            --territory-pass-ply=56 \
            --output=katacat-m0-output

      - name: Validate M0 data
        run: |
          npm run katacat:validate -- \
            --output=katacat-m0-output \
            --strict=true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements-katacat.txt

      - name: Install Python dependencies
        run: pip install -r ml/requirements-katacat.txt

      - name: Train M1 bootstrap checkpoint
        run: |
          python ml/train_katacat_m1.py \
            --data=katacat-m0-output/katacat-samples.jsonl \
            --out=katacat-m1-output \
            --epochs="${{ inputs.epochs }}" \
            --channels=96 \
            --blocks=8 \
            --device=cpu \
            --augment=on

      - name: Run neural PUCT integration
        env:
          RUN_KATACAT_M2_NEURAL: "1"
          KATACAT_M1_CHECKPOINT: katacat-m1-output/katacat-m1.pt
          KATACAT_M2_OUTPUT_DIR: katacat-m2-output
        run: npm run katacat:m2-neural

      - name: Add reports to summary
        if: always()
        shell: bash
        run: |
          {
            echo "## KataCat M2"
            echo
            echo "- Ref: \`${{ inputs.ref }}\`"
            echo "- M0 games: \`${{ inputs.games }}\`"
            echo "- M1 epochs: \`${{ inputs.epochs }}\`"
            echo "- PUCT simulations: \`${{ inputs.simulations }}\`"
            echo
            if [ -f katacat-m0-output/katacat-meta.json ]; then
              echo "### M0 acceptance"
              echo '```json'
              cat katacat-m0-output/katacat-meta.json
              echo '```'
            fi
            if [ -f katacat-m1-output/summary.json ]; then
              echo "### M1 bootstrap"
              echo '```json'
              cat katacat-m1-output/summary.json
              echo '```'
            fi
            if [ -f katacat-m2-output/summary.json ]; then
              echo "### M2 neural PUCT"
              echo '```json'
              cat katacat-m2-output/summary.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload KataCat M2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katacat-m2-${{ github.run_number }}
          path: |
            katacat-m0-output/
            katacat-m1-output/
            katacat-m2-output/
          if-no-files-found: ignore
