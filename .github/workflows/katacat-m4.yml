name: KataCat M4

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "M4 코드를 실행할 브랜치 또는 커밋"
        required: true
        default: "feat/katacat-m4"
        type: string
      games_per_opponent:
        description: "상대별 미러 대국 수 (짝수, 승격은 400 이상)"
        required: true
        default: "8"
        type: string
      simulations:
        description: "PUCT 착수당 simulation 수"
        required: true
        default: "32"
        type: string
      current_ms:
        description: "CURRENT VERY_HARD 한 수당 제한 시간(ms)"
        required: true
        default: "50"
        type: string
      strict_promotion:
        description: "400판·승률 기준을 실패 조건으로 적용"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  katacat-m4:
    name: Build candidate and run mirrored gatekeeper arena
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Fixed capture and defence regression suite
        run: npm run katacat:m2-core

      - name: Generate fixed M0 territory and replay suite
        run: |
          npm run katacat:generate -- \
            --games=20 \
            --teacher-ms=100 \
            --max-per-bucket=24 \
            --territory-pass-ply=56 \
            --output=katacat-m0-output

      - name: Validate fixed territory and replay suite
        run: |
          npm run katacat:validate -- \
            --output=katacat-m0-output \
            --strict=true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements-katacat.txt

      - name: Install Python dependencies
        run: pip install -r ml/requirements-katacat.txt

      - name: Train previous champion bootstrap
        run: |
          python ml/train_katacat_m1.py \
            --data=katacat-m0-output/katacat-samples.jsonl \
            --out=katacat-m1-output \
            --epochs=8 \
            --channels=96 \
            --blocks=8 \
            --device=cpu \
            --augment=on

      - name: Generate M3 visit-target self-play
        run: |
          npm run katacat:m3-selfplay -- \
            --checkpoint=katacat-m1-output/katacat-m1.pt \
            --games=4 \
            --simulations=64 \
            --max-moves=90 \
            --temperature-moves=12 \
            --noise-alpha=0.3 \
            --noise-fraction=0.25 \
            --output=katacat-m3-output

      - name: Train M3 promotion candidate
        run: |
          python ml/train_katacat_m3.py \
            --bootstrap-data=katacat-m0-output/katacat-samples.jsonl \
            --selfplay-data=katacat-m3-output/katacat-selfplay-samples.jsonl \
            --init-checkpoint=katacat-m1-output/katacat-m1.pt \
            --out=katacat-m3-model \
            --epochs=4 \
            --device=cpu \
            --augment=on

      - name: Run mirrored M4 arena
        env:
          RUN_KATACAT_M4_ARENA: "1"
          KATACAT_M4_CANDIDATE_CHECKPOINT: katacat-m3-model/katacat-m3.pt
          KATACAT_M4_CHAMPION_CHECKPOINT: katacat-m1-output/katacat-m1.pt
          KATACAT_M4_GAMES_PER_OPPONENT: ${{ inputs.games_per_opponent }}
          KATACAT_M4_SIMULATIONS: ${{ inputs.simulations }}
          KATACAT_M4_CURRENT_MS: ${{ inputs.current_ms }}
          KATACAT_M4_MAX_MOVES: "90"
          KATACAT_M4_PREVIOUS_THRESHOLD: "0.525"
          KATACAT_M4_CURRENT_THRESHOLD: "0.55"
          KATACAT_M4_STRICT_PROMOTION: ${{ inputs.strict_promotion && '1' || '0' }}
          KATACAT_M4_OUTPUT_DIR: katacat-m4-output
        run: npm run katacat:m4-arena

      - name: Add reports to summary
        if: always()
        shell: bash
        run: |
          {
            echo "## KataCat M4"
            echo
            echo "- Ref: \`${{ inputs.ref }}\`"
            echo "- Games per opponent: \`${{ inputs.games_per_opponent }}\`"
            echo "- PUCT simulations: \`${{ inputs.simulations }}\`"
            echo "- CURRENT budget: \`${{ inputs.current_ms }} ms\`"
            echo "- Strict promotion: \`${{ inputs.strict_promotion }}\`"
            echo
            if [ -f katacat-m4-output/arena-summary.json ]; then
              echo "### M4 mirrored arena"
              echo '```json'
              cat katacat-m4-output/arena-summary.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload KataCat M4 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katacat-m4-${{ github.run_id }}
          path: |
            katacat-m0-output/
            katacat-m1-output/
            katacat-m3-output/
            katacat-m3-model/
            katacat-m4-output/
          if-no-files-found: warn
          retention-days: 14
