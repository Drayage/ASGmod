name: KataCat M3.8 head ablation

on:
  workflow_dispatch:
    inputs:
      source_m372_run_id:
        description: "Successful KataCat M3.7.2 run ID; blank selects latest"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

env:
  KATACAT_M341_SIMULATIONS: "32"
  KATACAT_M341_CURRENT_MS: "50"
  KATACAT_M341_MAX_MOVES: "90"
  KATACAT_M341_CAPTURE_DEPTH: "7"
  KATACAT_M341_CAPTURE_ATTACK_MS: "25"
  KATACAT_M341_CAPTURE_DEFENSE_MS: "50"
  KATACAT_M341_CAPTURE_DEFENSE_LIMIT: "12"
  KATACAT_M341_FINAL_VERIFY_MS: "75"
  KATACAT_M341_FINAL_VERIFY_LIMIT: "5"
  KATACAT_M341_RESCUE_CURRENT_MS: "50"
  KATACAT_M341_RESCUE_VERIFY_MS: "50"
  KATACAT_M341_RESCUE_VERIFY_LIMIT: "8"
  KATACAT_M341_RESCUE_TOTAL_MS: "450"
  KATACAT_M341_EXHAUSTIVE_VERIFY_MS: "25"

jobs:
  prepare:
    name: Build fixed M3.8 head variants
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout M3.8 diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: feat/katacat-m38-head-ablation

      - name: Record commit SHA
        run: echo "KATACAT_M38_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements-katacat.txt
      - run: pip install -r ml/requirements-katacat.txt

      - name: Verify diagnostic code
        run: |
          npm run build
          python -m py_compile ml/build_katacat_m38_ablation.py
          node --check scripts/summarize-katacat-m38.mjs

      - name: Download accepted M3.7.2 checkpoints
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.source_m372_run_id }}
        run: |
          set -euo pipefail
          M372_RUN_ID="$REQUESTED_RUN_ID"
          if [ -z "$M372_RUN_ID" ]; then
            M372_RUN_ID=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/katacat-m372.yml/runs?status=success&per_page=20" \
              --jq '.workflow_runs[0].id')
          fi
          test -n "$M372_RUN_ID" && test "$M372_RUN_ID" != "null"
          mkdir -p source-m372
          gh run download "$M372_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "katacat-m372-prepared-${M372_RUN_ID}" --dir source-m372
          test -f source-m372/katacat-m372-model/summary.json
          test -f source-m372/katacat-m372-model/epochs/epoch-001.pt
          test -f source-m372/katacat-m372-model/epochs/epoch-002.pt
          test -f source-m372/source-m371/source-m36/prepared-artifact/katacat-m341-model/katacat-m341.pt
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('source-m372/katacat-m372-model/summary.json').read_text())
          assert summary['acceptance']['passed'] is True
          assert summary['selected_epoch'] == 2
          assert summary['maxPolicyLogitDelta'] == 0
          assert summary['selected']['frozenTacticalValidation']['regressionFailuresVsParent'] == 0
          assert summary['acceptance']['stemTrunkPolicyHeadByteStable'] is True
          PY
          echo "KATACAT_M38_SOURCE_M372_RUN_ID=$M372_RUN_ID" >> "$GITHUB_ENV"

      - name: Build epoch/head-isolated checkpoints
        run: >-
          python ml/build_katacat_m38_ablation.py
          --parent=source-m372/source-m371/source-m36/prepared-artifact/katacat-m341-model/katacat-m341.pt
          --epoch1=source-m372/katacat-m372-model/epochs/epoch-001.pt
          --epoch2=source-m372/katacat-m372-model/epochs/epoch-002.pt
          --out=katacat-m38-checkpoints
          --commit-sha=${KATACAT_M38_COMMIT_SHA}

      - name: Preserve parent control checkpoint
        run: >-
          cp source-m372/source-m371/source-m36/prepared-artifact/katacat-m341-model/katacat-m341.pt
          katacat-m38-checkpoints/katacat-m341-parent.pt

      - name: Add M3.8 build summary
        shell: bash
        run: |
          echo "## KataCat M3.8 fixed-head build" >> "$GITHUB_STEP_SUMMARY"
          echo "- source M3.7.2 run: ${KATACAT_M38_SOURCE_M372_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: ${KATACAT_M38_COMMIT_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat katacat-m38-checkpoints/summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload M3.8 checkpoints
        uses: actions/upload-artifact@v4
        with:
          name: katacat-m38-checkpoints-${{ github.run_id }}
          retention-days: 14
          path: katacat-m38-checkpoints/
          if-no-files-found: error

  ablation:
    name: Evaluate ${{ matrix.variant }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        variant:
          - e1-value-only
          - e1-score-only
          - e2-value-only
          - e2-score-only
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout M3.8 diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: feat/katacat-m38-head-ablation

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements-katacat.txt
      - run: pip install -r ml/requirements-katacat.txt

      - uses: actions/download-artifact@v4
        with:
          name: katacat-m38-checkpoints-${{ github.run_id }}
          path: katacat-m38-checkpoints

      - name: Run paired 32-game ablation arena
        env:
          RUN_KATACAT_M341_ARENA: "1"
          KATACAT_M341_CANDIDATE_CHECKPOINT: katacat-m38-checkpoints/katacat-m38-${{ matrix.variant }}.pt
          KATACAT_M341_PARENT_CHECKPOINT: katacat-m38-checkpoints/katacat-m341-parent.pt
          KATACAT_M341_PHASE: m38-head-ablation
          KATACAT_M341_GAMES_PER_COMPARISON: "32"
          KATACAT_M341_ARENA_OUTPUT_DIR: katacat-m38-arena/${{ matrix.variant }}
        run: npm run katacat:m341-arena

      - name: Upload variant arena
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katacat-m38-arena-${{ matrix.variant }}-${{ github.run_id }}
          retention-days: 14
          path: katacat-m38-arena/
          if-no-files-found: error

  summarize:
    name: Summarize paired M3.8 head evidence
    needs: [prepare, ablation]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout M3.8 diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: feat/katacat-m38-head-ablation

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: katacat-m38-checkpoints-${{ github.run_id }}
          path: katacat-m38-checkpoints

      - uses: actions/download-artifact@v4
        with:
          pattern: katacat-m38-arena-*-${{ github.run_id }}
          path: katacat-m38-arena
          merge-multiple: true

      - name: Summarize head-isolation evidence
        run: >-
          node scripts/summarize-katacat-m38.mjs
          --build=katacat-m38-checkpoints/summary.json
          --arena-root=katacat-m38-arena
          --output=katacat-m38-diagnostic/summary.json

      - name: Add diagnostic summary
        shell: bash
        run: |
          echo "## KataCat M3.8 head ablation" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat katacat-m38-diagnostic/summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload M3.8 diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: katacat-m38-diagnostic-${{ github.run_id }}
          retention-days: 14
          path: |
            katacat-m38-checkpoints/summary.json
            katacat-m38-arena/
            katacat-m38-diagnostic/summary.json
          if-no-files-found: error
