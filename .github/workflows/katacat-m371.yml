name: KataCat M3.7.1

on:
  workflow_dispatch:
    inputs:
      source_m37_run_id:
        description: "Successful KataCat M3.7 run ID; blank selects latest"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

env:
  KATACAT_M341_SIMULATIONS: "32"
  KATACAT_M341_CURRENT_MS: "50"
  KATACAT_M341_MAX_MOVES: "90"
  KATACAT_M341_CAPTURE_DEPTH: "7"
  KATACAT_M341_CAPTURE_ATTACK_MS: "25"
  KATACAT_M341_CAPTURE_DEFENSE_MS: "50"
  KATACAT_M341_CAPTURE_DEFENSE_LIMIT: "12"
  KATACAT_M341_FINAL_VERIFY_MS: "75"
  KATACAT_M341_FINAL_VERIFY_LIMIT: "5"
  KATACAT_M341_RESCUE_CURRENT_MS: "50"
  KATACAT_M341_RESCUE_VERIFY_MS: "50"
  KATACAT_M341_RESCUE_VERIFY_LIMIT: "8"
  KATACAT_M341_RESCUE_TOTAL_MS: "450"
  KATACAT_M341_EXHAUSTIVE_VERIFY_MS: "25"

jobs:
  prepare_smoke:
    name: Rebuild targets, retrain conservatively, and run smoke
    runs-on: ubuntu-latest
    timeout-minutes: 420
    outputs:
      smoke_pass: ${{ steps.smoke_gate.outputs.passed }}

    steps:
      - name: Checkout M3.7.1 branch
        uses: actions/checkout@v4
        with:
          ref: feat/katacat-m371

      - name: Record commit SHA
        run: |
          echo "KATACAT_M371_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "KATACAT_M37_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements-katacat.txt
      - run: pip install -r ml/requirements-katacat.txt

      - name: Build and verify static contracts
        run: |
          npm run build
          npm run katacat:m2-core
          npm run katacat:m32-final-guard
          npm run katacat:m33-relative
          npm run katacat:m341-fallback
          python -m py_compile ml/prepare_katacat_m371_data.py ml/train_katacat_m37.py
          node --check scripts/gate-katacat-m37.mjs

      - name: Download M3.7 league, M3.6 hard negatives, and M3.3 replay
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.source_m37_run_id }}
        run: |
          set -euo pipefail
          M37_RUN_ID="$REQUESTED_RUN_ID"
          if [ -z "$M37_RUN_ID" ]; then
            M37_RUN_ID=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/katacat-m37.yml/runs?status=success&per_page=20" \
              --jq '.workflow_runs[0].id')
          fi
          test -n "$M37_RUN_ID" && test "$M37_RUN_ID" != "null"
          mkdir -p source-m37 source-m36 source-m33
          gh run download "$M37_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "katacat-m37-prepared-${M37_RUN_ID}" --dir source-m37
          test -f source-m37/katacat-m37-manifest.json
          test -f source-m37/katacat-m37-league/katacat-m37-league-samples.jsonl
          M36_RUN_ID=$(jq -r '.sourceM36RunId // empty' source-m37/katacat-m37-manifest.json)
          M33_RUN_ID=$(jq -r '.sourceM33RunId // empty' source-m37/katacat-m37-manifest.json)
          test -n "$M36_RUN_ID" && test -n "$M33_RUN_ID"
          gh run download "$M36_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "katacat-m36-prepared-${M36_RUN_ID}" --dir source-m36
          gh run download "$M33_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "katacat-m33-${M33_RUN_ID}" --dir source-m33
          test -f source-m36/prepared-artifact/katacat-m341-model/katacat-m341.pt
          test -f source-m36/katacat-m36-hard-negative/katacat-m341-hard-negative-samples.jsonl
          test -f source-m36/katacat-m36-hard-negative/katacat-m341-regression-fixtures.json
          test -f source-m33/katacat-m0-output/katacat-samples.jsonl
          test -f source-m33/katacat-m3-output/katacat-selfplay-samples.jsonl
          test -f source-m33/katacat-m33-mixed/katacat-m33-mixed-samples.jsonl
          test -f source-m33/katacat-m33-curriculum/katacat-m33-curriculum-samples.jsonl
          echo "KATACAT_M371_SOURCE_M37_RUN_ID=$M37_RUN_ID" >> "$GITHUB_ENV"
          echo "KATACAT_M371_SOURCE_M36_RUN_ID=$M36_RUN_ID" >> "$GITHUB_ENV"
          echo "KATACAT_M371_SOURCE_M33_RUN_ID=$M33_RUN_ID" >> "$GITHUB_ENV"

      - name: Prepare pair-split parent-preserving M3.7.1 targets
        run: >-
          python ml/prepare_katacat_m371_data.py
          --league-data=source-m37/katacat-m37-league/katacat-m37-league-samples.jsonl
          --hard-negative-data=source-m36/katacat-m36-hard-negative/katacat-m341-hard-negative-samples.jsonl
          --checkpoint=source-m36/prepared-artifact/katacat-m341-model/katacat-m341.pt
          --out=katacat-m371-data
          --temperature=1.0
          --candidate-executed-boost=0.15
          --current-executed-boost=0.08
          --hard-positive-boost=0.15
          --territory-train-copies=6
          --pair-validation-modulo=5

      - name: Re-run actual-loss fallback regressions
        env:
          KATACAT_M341_REGRESSION_FIXTURE: source-m36/katacat-m36-hard-negative/katacat-m341-regression-fixtures.json
          KATACAT_M341_REGRESSION_OUTPUT: katacat-m371-regression/summary.json
        run: |
          mkdir -p katacat-m371-regression
          npm run katacat:m341-fallback

      - name: Train M3.7.1 conservative representation candidate
        run: >-
          python ml/train_katacat_m37.py
          --league-data=katacat-m371-data/katacat-m371-league-samples.jsonl
          --bootstrap-data=source-m33/katacat-m0-output/katacat-samples.jsonl
          --selfplay-data=source-m33/katacat-m3-output/katacat-selfplay-samples.jsonl
          --mixed-data=source-m33/katacat-m33-mixed/katacat-m33-mixed-samples.jsonl
          --curriculum-data=source-m33/katacat-m33-curriculum/katacat-m33-curriculum-samples.jsonl
          --hard-negative-data=katacat-m371-data/katacat-m371-hard-negative-samples.jsonl
          --init-checkpoint=source-m36/prepared-artifact/katacat-m341-model/katacat-m341.pt
          --out=katacat-m371-model
          --epochs=12
          --learning-rate=0.00002
          --trainable-trunk-blocks=1
          --league-sampling-weight=2.0
          --hard-sampling-weight=5.0
          --stability-sampling-weight=1.0
          --policy-distill-weight=4.0
          --value-distill-weight=0.75
          --score-distill-weight=0.35
          --ownership-distill-weight=0.75
          --commit-sha=${KATACAT_M371_COMMIT_SHA}
          --device=cpu
          --augment=on

      - name: Validate M3.7.1 selection contract
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          prepared = json.loads(Path('katacat-m371-data/summary.json').read_text())
          summary = json.loads(Path('katacat-m371-model/summary.json').read_text())
          assert prepared['acceptance']['passed'] is True
          assert prepared['acceptance']['mirroredPairsShareSplit'] is True
          assert prepared['acceptance']['hardNegativeMasksPreserved'] is True
          assert summary['acceptance']['passed'] is True
          assert summary['trainableScope'] == 'LAST_1_TRUNK_BLOCKS_AND_ALL_HEADS'
          assert summary['selected']['frozenTacticalValidation']['regressionFailuresVsParent'] == 0
          parent = Path('source-m36/prepared-artifact/katacat-m341-model/katacat-m341.pt')
          candidate = Path('katacat-m371-model/katacat-m37.pt')
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          assert digest(parent) == summary['parent_checkpoint_sha256']
          assert digest(candidate) == summary['selected_checkpoint_sha256']
          if summary['selected_epoch'] == 0:
              assert summary['improved_over_parent'] is False
              assert digest(parent) == digest(candidate)
          PY

      - name: Record manifest and checkpoint hashes
        shell: bash
        run: |
          PARENT_SHA=$(sha256sum source-m36/prepared-artifact/katacat-m341-model/katacat-m341.pt | awk '{print $1}')
          CANDIDATE_SHA=$(sha256sum katacat-m371-model/katacat-m37.pt | awk '{print $1}')
          python - <<PY
          import json
          from pathlib import Path
          model = json.loads(Path('katacat-m371-model/summary.json').read_text())
          Path('katacat-m371-manifest.json').write_text(json.dumps({
              'schemaVersion': 1,
              'stage': 'M3.7.1_MANIFEST',
              'sourceM37RunId': '${KATACAT_M371_SOURCE_M37_RUN_ID}',
              'sourceM36RunId': '${KATACAT_M371_SOURCE_M36_RUN_ID}',
              'sourceM33RunId': '${KATACAT_M371_SOURCE_M33_RUN_ID}',
              'commitSha': '${KATACAT_M371_COMMIT_SHA}',
              'parentCheckpointSha256': '$PARENT_SHA',
              'candidateCheckpointSha256': '$CANDIDATE_SHA',
              'selectedEpoch': model['selected_epoch'],
              'improvedOverParent': model['improved_over_parent'],
              'behaviorEquivalentToParent': model['behaviorEquivalentToParent'],
          }, indent=2) + '\n')
          PY

      - name: Run 32-game smoke per comparison
        env:
          RUN_KATACAT_M341_ARENA: "1"
          KATACAT_M341_CANDIDATE_CHECKPOINT: katacat-m371-model/katacat-m37.pt
          KATACAT_M341_PARENT_CHECKPOINT: source-m36/prepared-artifact/katacat-m341-model/katacat-m341.pt
          KATACAT_M341_PHASE: m371-smoke
          KATACAT_M341_GAMES_PER_COMPARISON: "32"
          KATACAT_M341_ARENA_OUTPUT_DIR: katacat-m371-smoke
        run: npm run katacat:m341-arena

      - name: Evaluate M3.7.1 smoke gate
        id: smoke_gate
        run: >-
          npm run katacat:m37-gate --
          --phase=smoke
          --training=katacat-m371-model/summary.json
          --regression=katacat-m371-regression/summary.json
          --arena=katacat-m371-smoke/arena-summary.json
          --output=katacat-m371-gates/smoke.json

      - name: Add M3.7.1 prepare and smoke summary
        if: always()
        shell: bash
        run: |
          echo "## KataCat M3.7.1 Prepare + Smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: ${KATACAT_M371_COMMIT_SHA:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- source M3.7 run: ${KATACAT_M371_SOURCE_M37_RUN_ID:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- source M3.6 run: ${KATACAT_M371_SOURCE_M36_RUN_ID:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- smoke pass: ${{ steps.smoke_gate.outputs.passed }}" >> "$GITHUB_STEP_SUMMARY"
          for report in \
            katacat-m371-data/summary.json \
            katacat-m371-regression/summary.json \
            katacat-m371-model/summary.json \
            katacat-m371-manifest.json \
            katacat-m371-smoke/arena-summary.json \
            katacat-m371-gates/smoke.json; do
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "### $report" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            test -f "$report" && cat "$report" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload prepared M3.7.1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katacat-m371-prepared-${{ github.run_id }}
          retention-days: 14
          path: |
            source-m36/prepared-artifact/katacat-m341-model/katacat-m341.pt
            katacat-m371-data/
            katacat-m371-regression/
            katacat-m371-model/
            katacat-m371-manifest.json
            katacat-m371-smoke/
            katacat-m371-gates/smoke.json
          if-no-files-found: warn

  development:
    name: Run 128-game M3.7.1 development evaluation
    needs: prepare_smoke
    if: needs.prepare_smoke.outputs.smoke_pass == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      development_pass: ${{ steps.development_gate.outputs.passed }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/katacat-m371
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements-katacat.txt
      - run: pip install -r ml/requirements-katacat.txt
      - uses: actions/download-artifact@v4
        with:
          name: katacat-m371-prepared-${{ github.run_id }}
          path: .
      - name: Run 128-game development phase
        env:
          RUN_KATACAT_M341_ARENA: "1"
          KATACAT_M341_CANDIDATE_CHECKPOINT: katacat-m371-model/katacat-m37.pt
          KATACAT_M341_PARENT_CHECKPOINT: source-m36/prepared-artifact/katacat-m341-model/katacat-m341.pt
          KATACAT_M341_PHASE: m371-development
          KATACAT_M341_GAMES_PER_COMPARISON: "128"
          KATACAT_M341_ARENA_OUTPUT_DIR: katacat-m371-development
        run: npm run katacat:m341-arena
      - name: Evaluate development gate
        id: development_gate
        run: >-
          npm run katacat:m37-gate --
          --phase=development
          --training=katacat-m371-model/summary.json
          --regression=katacat-m371-regression/summary.json
          --arena=katacat-m371-development/arena-summary.json
          --output=katacat-m371-gates/development.json
      - name: Upload development artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katacat-m371-development-${{ github.run_id }}
          path: |
            katacat-m371-development/
            katacat-m371-gates/development.json
          if-no-files-found: warn

  promotion:
    name: Run 400-game M3.7.1 promotion evaluation
    needs: [prepare_smoke, development]
    if: needs.development.outputs.development_pass == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/katacat-m371
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements-katacat.txt
      - run: pip install -r ml/requirements-katacat.txt
      - uses: actions/download-artifact@v4
        with:
          name: katacat-m371-prepared-${{ github.run_id }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: katacat-m371-development-${{ github.run_id }}
          path: .
      - name: Run 400-game promotion phase
        env:
          RUN_KATACAT_M341_ARENA: "1"
          KATACAT_M341_CANDIDATE_CHECKPOINT: katacat-m371-model/katacat-m37.pt
          KATACAT_M341_PARENT_CHECKPOINT: source-m36/prepared-artifact/katacat-m341-model/katacat-m341.pt
          KATACAT_M341_PHASE: m371-promotion
          KATACAT_M341_GAMES_PER_COMPARISON: "400"
          KATACAT_M341_ARENA_OUTPUT_DIR: katacat-m371-promotion
        run: npm run katacat:m341-arena
      - name: Evaluate promotion gate
        run: >-
          npm run katacat:m37-gate --
          --phase=promotion
          --training=katacat-m371-model/summary.json
          --regression=katacat-m371-regression/summary.json
          --arena=katacat-m371-promotion/arena-summary.json
          --development=katacat-m371-development/arena-summary.json
          --output=katacat-m371-gates/promotion.json
      - name: Upload promotion artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katacat-m371-promotion-${{ github.run_id }}
          path: |
            katacat-m371-promotion/
            katacat-m371-gates/promotion.json
          if-no-files-found: warn
