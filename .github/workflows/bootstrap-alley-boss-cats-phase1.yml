name: Bootstrap and run Alley Boss Cats Phase 1

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  install-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout workflow and payload branch
        uses: actions/checkout@v4
        with:
          ref: claude/abstract-strategy-games-setup-h93ot5
          path: launcher
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
          fetch-depth: 0
      - name: Install Phase 1 files on main
        shell: bash
        run: |
          set -euo pipefail
          cat launcher/.github/phase1-payload/part-*.b64 > /tmp/phase1.tar.gz.b64
          base64 -d /tmp/phase1.tar.gz.b64 > /tmp/phase1.tar.gz
          tar -xzf /tmp/phase1.tar.gz -C repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai-arena.mts \
            src/games/alley-boss-cats/arenaMetrics.ts \
            src/games/alley-boss-cats/ownershipBaselines.ts \
            scripts/aggregate-ai-arena.mjs \
            scripts/generate-ownership-dataset.ts \
            scripts/generate-human-ownership-validation.ts \
            scripts/aggregate-ownership-dataset.mjs \
            docs/newbuild-games-32293a1.json \
            .github/workflows/alley-boss-cats-phase1.yml
          if ! git diff --cached --quiet; then
            git commit -m "feat(ai): add Phase 1 arena and ownership data pipeline" \
              -m "Adds reason-split territory margins, shard-aware arena output, 32-game screening, 8-way aggregation, 200-game ownership pilot generation, one-rollout-per-game capture-suppressed labels, D4 augmentation, heuristic baselines, and the isolated 20-game human validation set. No model training, minimax, guard, tuning, or gameplay-path changes."
            git push origin HEAD:main
          fi
      - name: Dispatch the 32-game screen and 200-game pilot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run alley-boss-cats-phase1.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f arena_mode=screen \
            -f run_dataset=true
