name: KataCat M3.3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  katacat-m33:
    name: Train player-relative model and test B-seat curriculum
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: Checkout M3.3 branch
        uses: actions/checkout@v4
        with:
          ref: feat/katacat-m33

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Verify PUCT tactical floor
        run: npm run katacat:m2-core

      - name: Verify adaptive final guard
        run: npm run katacat:m32-final-guard

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements-katacat.txt

      - name: Install Python dependencies
        run: pip install -r ml/requirements-katacat.txt

      - name: Verify player-relative encoding
        run: npm run katacat:m33-relative

      - name: Generate M0 bootstrap data
        run: npm run katacat:generate -- --games=20 --teacher-ms=100 --max-per-bucket=24 --territory-pass-ply=56 --output=katacat-m0-output

      - name: Validate M0 replay and coverage
        run: npm run katacat:validate -- --output=katacat-m0-output --strict=true

      - name: Train frozen absolute M1 champion
        run: python ml/train_katacat_m1.py --data=katacat-m0-output/katacat-samples.jsonl --out=katacat-m1-output --epochs=8 --channels=96 --blocks=8 --device=cpu --augment=on

      - name: Generate absolute M3 self-play
        run: npm run katacat:m3-selfplay -- --checkpoint=katacat-m1-output/katacat-m1.pt --games=4 --simulations=64 --max-moves=90 --temperature-moves=12 --noise-alpha=0.3 --noise-fraction=0.25 --output=katacat-m3-output

      - name: Train absolute M3 candidate
        run: python ml/train_katacat_m3.py --bootstrap-data=katacat-m0-output/katacat-samples.jsonl --selfplay-data=katacat-m3-output/katacat-selfplay-samples.jsonl --init-checkpoint=katacat-m1-output/katacat-m1.pt --out=katacat-m3-model --epochs=4 --device=cpu --augment=on

      - name: Generate expanded mixed CURRENT curriculum source
        run: npm run katacat:m31-mixed -- --latest=katacat-m3-model/katacat-m3.pt --champion=katacat-m1-output/katacat-m1.pt --games=20 --simulations=48 --current-ms=50 --max-moves=90 --capture-depth=7 --capture-attack-ms=25 --capture-defense-ms=50 --capture-defense-limit=12 --output=katacat-m31-output

      - name: Create M3.3 game-level mixed split
        run: >-
          python ml/resplit_katacat_m33_mixed.py
          --samples=katacat-m31-output/katacat-m31-samples.jsonl
          --games=katacat-m31-output/katacat-m31-games.jsonl
          --out=katacat-m33-mixed
          --validation-modulo=6
          --validation-offset=0

      - name: Train frozen absolute M3.1 champion
        run: >-
          python ml/train_katacat_m3.py
          --bootstrap-data=katacat-m0-output/katacat-samples.jsonl
          --selfplay-data=katacat-m3-output/katacat-selfplay-samples.jsonl
          --mixed-data=katacat-m33-mixed/katacat-m33-mixed-samples.jsonl
          --init-checkpoint=katacat-m3-model/katacat-m3.pt
          --out=katacat-m31-model
          --epochs=4
          --device=cpu
          --augment=on

      - name: Build balanced B-seat tactical curriculum
        run: >-
          python ml/build_katacat_m33_curriculum.py
          --samples=katacat-m33-mixed/katacat-m33-mixed-samples.jsonl
          --games=katacat-m33-mixed/katacat-m33-mixed-games.jsonl
          --out=katacat-m33-curriculum
          --max-per-seat=96
          --late-window=8

      - name: Train fresh player-relative M3.3 candidate
        run: >-
          python ml/train_katacat_m33.py
          --bootstrap-data=katacat-m0-output/katacat-samples.jsonl
          --selfplay-data=katacat-m3-output/katacat-selfplay-samples.jsonl
          --mixed-data=katacat-m33-mixed/katacat-m33-mixed-samples.jsonl
          --curriculum-data=katacat-m33-curriculum/katacat-m33-curriculum-samples.jsonl
          --out=katacat-m33-model
          --epochs=8
          --channels=96
          --blocks=8
          --device=cpu
          --augment=on

      - name: Run M3.3 controlled fair arena
        env:
          RUN_KATACAT_M33_ARENA: "1"
          KATACAT_M33_CANDIDATE_CHECKPOINT: katacat-m33-model/katacat-m33.pt
          KATACAT_M33_CHAMPION_CHECKPOINT: katacat-m31-model/katacat-m3.pt
          KATACAT_M33_GAMES_PER_OPPONENT: "16"
          KATACAT_M33_SIMULATIONS: "32"
          KATACAT_M33_CURRENT_MS: "50"
          KATACAT_M33_MAX_MOVES: "90"
          KATACAT_M33_CAPTURE_DEPTH: "7"
          KATACAT_M33_CAPTURE_ATTACK_MS: "25"
          KATACAT_M33_CAPTURE_DEFENSE_MS: "50"
          KATACAT_M33_CAPTURE_DEFENSE_LIMIT: "12"
          KATACAT_M33_FINAL_VERIFY_MS: "75"
          KATACAT_M33_FINAL_VERIFY_LIMIT: "5"
          KATACAT_M33_RESCUE_CURRENT_MS: "50"
          KATACAT_M33_RESCUE_VERIFY_MS: "50"
          KATACAT_M33_RESCUE_VERIFY_LIMIT: "8"
          KATACAT_M33_RESCUE_TOTAL_MS: "450"
          KATACAT_M33_OUTPUT_DIR: katacat-m33-output
        run: npm run katacat:m33-arena

      - name: Add M3.3 reports to summary
        if: always()
        shell: bash
        run: |
          echo "## KataCat M3.3" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "- Encoding: player-relative v1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Seat balance: deterministic downsampling of real recorded positions" >> "$GITHUB_STEP_SUMMARY"
          echo "- Curriculum: train-only CURRENT teacher, B-seat tactical priority" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate: fresh 96×8 network, no incompatible absolute checkpoint init" >> "$GITHUB_STEP_SUMMARY"
          echo "- Previous champion: frozen M3.1 absolute model trained on the same resplit mixed source" >> "$GITHUB_STEP_SUMMARY"
          echo "- Arena: 16 mirrored games/opponent with identical tactical rescue" >> "$GITHUB_STEP_SUMMARY"
          for report in \
            katacat-m33-mixed/summary.json \
            katacat-m33-curriculum/summary.json \
            katacat-m31-model/summary.json \
            katacat-m33-model/summary.json \
            katacat-m33-output/arena-summary.json; do
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "### $report" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            test -f "$report" && cat "$report" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload M3.3 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katacat-m33-${{ github.run_id }}
          path: |
            katacat-m0-output/
            katacat-m1-output/
            katacat-m3-output/
            katacat-m3-model/
            katacat-m31-output/
            katacat-m33-mixed/
            katacat-m31-model/
            katacat-m33-curriculum/
            katacat-m33-model/
            katacat-m33-output/
          if-no-files-found: warn
